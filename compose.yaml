
services:
  backend:
    image: node:22-alpine
    container_name: bookease-backend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/bookease?replicaSet=rs0
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  frontend:
    image: node:22-alpine
    container_name: bookease-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1

  mongo:
    image: mongo:8.0
    container_name: bookease-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:8.0
    container_name: bookease-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["mongosh", "--host", "mongo:27017", "--quiet", "--eval"]
    command:
      - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }"
    restart: "no"

volumes:
  backend_node_modules:
  frontend_node_modules:
  mongodb_data:
